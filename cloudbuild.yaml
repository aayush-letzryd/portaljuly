steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:latest'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:latest'

  # Step 3: Deploy to Cloud Run in asia-south1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portaljuly'
      - '--image'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/letzryd-dev-test/portaljuly/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'