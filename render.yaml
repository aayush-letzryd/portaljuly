services:
  - type: web
    name: portal-letzryd
    env: python
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString

databases:
  - name: portal-db
    databaseName: portal_letzryd
    user: portal_admin
